[project]
name = "veripromiseesg-2026-team-9906"
version = "0.1.0"
description = "VeriPromiseESG 2026 TEAM_9906 notebooks and scripts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "openai>=2.9",
    "pandas>=2.3",
    "python-dotenv>=1.2",
    "scikit-learn>=1.7",
    "seaborn>=0.13",
    "tqdm>=4.67",
]

[project.optional-dependencies]
model = [
    "accelerate>=1.12",
    "datasets>=4.4",
    "huggingface-hub>=1.3",
    "joblib>=1.5",
    "peft>=0.18",
    "sentence-transformers>=5.1",
    "setfit>=1.1",
    "torch>=2.9",
    "transformers>=4.57",
]
notebook = [
    "ipykernel>=7.1",
    "jupyter>=1.1",
]
gpu = [
    "bitsandbytes>=0.46.1; platform_system == 'Linux'",
]

[tool.uv]
package = false
